  description: Send a login request to a remote companion target.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    pub_key:
      required: true
      selector:
        text:
    password:
      selector:
        text:
    companion_name:
      selector:
        text:

companion_request_status:
  name: Companion request status
  description: Request status from a remote companion target. Optionally set response_variable to receive the backend result dictionary (non-dictionary results are wrapped under result). Existing calls without a response remain supported.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    pub_key:
      required: true
      selector:
        text:
    timeout:
      description: Remote reply wait in seconds (1–120). HTTP allows 10 additional seconds.
      default: 15
      selector:
        number:
          min: 1
          max: 120
          mode: box
    companion_name:
      selector:
        text:

companion_request_telemetry:
  name: Companion request telemetry
  description: Request telemetry from a remote companion target. Optionally set response_variable to receive the backend result dictionary (non-dictionary results are wrapped under result). Existing calls without a response remain supported.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    pub_key:
      required: true
      selector:
        text:
    timeout:
      description: Remote reply wait in seconds (1–120). HTTP allows 10 additional seconds.
      default: 20
      selector:
        number:
          min: 1
          max: 120
          mode: box
    want_base:
      default: true
      selector:
        boolean:
    want_location:
      default: true
      selector:
        boolean:
    want_environment:
      default: true
      selector:
        boolean:
    companion_name:
      selector:
        text:

companion_send_command:
  name: Companion send command
  description: Send a repeater command through a companion bridge.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    pub_key:
      required: true
      selector:
        text:
    command:
      required: true
      selector:
        text:
    parameters:
      selector:
        object:
    companion_name:
      selector:
        text:

companion_reset_path:
  name: Companion reset path
  description: Reset the stored path for a remote companion target.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    pub_key:
      required: true
      selector:
        text:
    companion_name:
      selector:
        text:

companion_set_advert_name:
