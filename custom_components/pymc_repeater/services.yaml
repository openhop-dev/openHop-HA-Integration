enable_plugin:
  name: Enable plugin
  description: Enable persistently and start service plugins. Returns minimized outcome metadata. Shared write admission; uncertain completion requires reconciliation, not retries. HTTP budget 930 seconds. No immediate refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:

disable_plugin:
  name: Disable plugin
  description: Stop and disable persistently. Returns minimized outcome metadata. Shared write admission; uncertain completion requires reconciliation, not retries. HTTP budget 930 seconds. No immediate refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:

start_plugin:
  name: Start plugin
  description: Start an enabled service plugin without changing enabled state. Returns minimized outcome metadata. Shared write admission; uncertain completion requires reconciliation, not retries. HTTP budget 930 seconds. No immediate refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:

stop_plugin:
  name: Stop plugin
  description: Stop without disabling; enabled plugins can start again after manager restart. Returns minimized outcome metadata. Shared write admission; uncertain completion requires reconciliation, not retries. HTTP budget 930 seconds. No immediate refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:

restart_plugin:
  name: Restart plugin
  description: Restart an enabled service plugin. Returns minimized outcome metadata. Shared write admission; uncertain completion requires reconciliation, not retries. HTTP budget 930 seconds. No immediate refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:

uninstall_plugin:
  name: Uninstall plugin
  description: Remove code; preserve plugin data unless delete_data is explicitly true. Returns minimized outcome metadata. Shared write admission; uncertain completion requires reconciliation, not retries. HTTP budget 930 seconds. No immediate refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:
    delete_data:
      description: Permanently delete plugin-owned data as well as release code. Defaults to data preservation.
      default: false
      selector:
        boolean:

get_plugin_catalogue:
  name: Get plugin catalogue
  description: Return public catalogue metadata for at most 100 entries, without settings, URLs or raw errors. Explicit network request; no polling or refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    force_refresh:
      description: Refresh backend catalogue/release caches.
      default: false
      selector:
        boolean:

install_catalogue_plugin:
  name: Install catalogue plugin
  description: Install a backend-approved catalogue wheel. Can replace existing code; does not invent version approval. Returns metadata only. HTTP budget 930 seconds; no blind retries or immediate refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:
    version:
      description: Optional exact approved version token; omit for backend-selected version.
      selector:
        text:
    force_refresh:
      description: Refresh backend catalogue/release caches.
      default: false
      selector:
        boolean:

get_plugin_settings:
  name: Get plugin settings
  description: Read effective saved/default configuration on demand. Common credential keys are redacted by default; sensitive responses can enter HA action traces. No polling or refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:
    include_sensitive:
      description: Return actual plugin credentials for a full replacement edit. Treat responses and action traces as sensitive; backend does not preserve placeholder masks.
      default: false
      selector:
        boolean:

update_plugin_settings:
  name: Update plugin settings
  description: Replace the entire plugin configuration JSON object, at most 256 KiB. Redacted placeholders are rejected. Returns metadata only, never configuration. No immediate refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact plugin ID, 1–128 ASCII token characters starting alphanumeric.
      selector:
        text:
    config:
      required: true
      description: Complete JSON object, not a JSON string or partial patch.
      selector:
        object:
    restart:
      description: Restart an enabled service plugin after saving; UI-only or disabled plugins are not restarted.
      default: false
      selector:
        boolean:

get_sensor_types:
  name: Get sensor types
  description: Return available sensor types and settings schemas without hardware reads or refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater

get_sensor_configuration:
  name: Get sensor configuration
  description: Read the sensor section on demand. Preserve backend password masks and _original_name hints for full replacement edits. No hardware reads or refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    include_sensitive:
      description: Return other unmasked credential fields if needed for an edit. Backend password masks remain masked. Responses and traces may be sensitive.
      default: false
      selector:
        boolean:

update_sensor_configuration:
  name: Update sensor configuration
  description: Replace the entire sensor section, not a partial patch. Saving requires a separate Repeater restart to apply. No automatic restart, forced read or refresh.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    config:
      required: true
      description: Complete JSON object with enabled, positive finite poll_interval_seconds, auto_install_packages and all definitions (at most 100). Preserve password ***** masks and _original_name origins. Maximum 256 KiB.
      selector:
        object:

set_acl_permissions:
  name: Set ACL permissions
  description: Add or change a client role on an exact identity. Role is the low two bits (1 read-only, 2 read-write, 3 admin); higher flags are preserved. Guest role 0 is rejected. Room servers persist only admins; inspect persisted in the optional response. Refreshes cached telemetry after success.
  fields:
    config_entry_id:
      description: Select the Repeater entry; required when multiple entries are configured.
      selector:
        config_entry:
          integration: pymc_repeater
    identity_name:
      required: true
      description: Exact repeater identity or room server name, at most 256 characters.
      selector:
        text:
    client_pubkey:
      required: true
      description: Exact full 64-character hexadecimal client public key.
      selector:
        text:
    permissions:
      required: true
      description: Integer 1–255 with low two bits 1, 2 or 3. Multiples of four are invalid.
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: box

check_plugin_updates:
  name: Check plugin updates
  description: Check eligible installed catalogue plugins on demand and return sanitized per-plugin outcomes. Does not enable a schedule or change polling.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      description: Optional exact installed plugin ID (1–128 ASCII letters, digits, dots, underscores, plus or hyphen; starts alphanumeric). Omit to check all.
      selector:
        text:
    force_refresh:
      description: Refresh backend catalogue/release caches instead of using cached metadata.
      default: false
      selector:
        boolean:

update_plugin:
  name: Update plugin
  description: Upgrade one eligible installed catalogue plugin and return success, skipped, failure or unknown. May take 930 seconds per request. Unknown outcomes require manual reconciliation before reloading the entry; never retry blindly.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    plugin_id:
      required: true
      description: Exact installed plugin ID (1–128 ASCII token characters; starts alphanumeric).
      selector:
        text:
    version:
      description: Optional exact version token (1–128 ASCII letters, digits, dots, underscores, plus or hyphen; starts alphanumeric). Backend catalogue approval still applies.
      selector:
        text:
    force_refresh:
      default: false
      selector:
        boolean:

update_all_plugins:
  name: Update all plugins
  description: Sequentially upgrade all eligible installed catalogue plugins (maximum inventory 100). Continue ordinary errors but stop on unknown/conflict outcomes. Returns per-plugin outcomes and counts. No schedule is enabled automatically.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    force_refresh:
      description: Refresh backend metadata. This may contact the catalogue or GitHub.
      default: false
      selector:
        boolean:

ping_neighbor:
  name: Ping neighbor
  description: Send a ping to a neighbor by hash/path ID.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    target_id:
      required: true
      selector:
        text:
    timeout:
      description: Remote reply wait in seconds (1–60). HTTP allows 6 additional seconds.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          mode: box

send_advert:
  name: Send advert
  description: Send a Repeater advert using the flood or direct mode supported by current Repeater dev builds.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    mode:
      default: flood
      selector:
        select:
          options:
            - flood
            - direct

publish_neighbors:
  name: Publish MQTT neighbors
  description: Schedule a neighbor discovery, scope-query, and MQTT publication cycle. The Repeater must have neighbor publishing enabled and an opted-in broker.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater

get_neighbor_scopes:
  name: Get neighbor scopes
  description: Return the last stored region-scope result for each queried neighbor and the scopes served by this Repeater.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater

query_neighbor_scopes:
  name: Query neighbor scopes
  description: Query one zero-hop neighbor for its served region scopes. This can take up to 45 seconds and is rate-limited by the remote node.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    pubkey:
      required: true
      selector:
        text:

room_post_message:
  name: Post room message
  description: Post a message to an openHop room server.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    room_name:
      selector:
        text:
    room_hash:
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    author_pubkey:
      default: server
      selector:
        text:
    txt_type:
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box

room_messages_clear:
  name: Clear room messages
  description: Delete all messages from a room server.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    room_name:
      selector:
        text:
    room_hash:
      selector:
        text:

cad_calibration_start:
  name: Start CAD calibration
  description: Start CAD calibration on the repeater.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    samples:
      default: 8
      selector:
        number:
          min: 1
          max: 64
          mode: box
    delay:
      default: 100
      selector:
        number:
          min: 0
          max: 2000
          mode: box
    known_signal_present:
      default: false
      selector:
        boolean:
    cad_symbol_num:
      default: 2
      selector:
        select:
          options:
            - "1"
            - "2"
            - "4"
            - "8"
            - "16"
    cad_timeout_ms:
      default: 500
      selector:
        number:
          min: 50
          max: 5000
          mode: box

cad_calibration_stop:
  name: Stop CAD calibration
  description: Stop an active CAD calibration run.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater

cad_manual_check:
  name: Run manual CAD check
  description: Run immediate CAD checks and return detection diagnostics. The HTTP budget scales with samples and CAD timeout, up to 167 seconds.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    samples:
      default: 1
      selector:
        number:
          min: 1
          max: 32
          mode: box
    det_peak:
      selector:
        number:
          min: 0
          max: 255
          mode: box
    det_min:
      selector:
        number:
          min: 0
          max: 255
          mode: box
    cad_symbol_num:
      selector:
        select:
          options:
            - "1"
            - "2"
            - "4"
            - "8"
            - "16"
    cad_timeout_ms:
      default: 500
      selector:
        number:
          min: 50
          max: 5000
          mode: box
    apply_live:
      default: false
      selector:
        boolean:

save_cad_settings:
  name: Save CAD settings
  description: Save CAD calibration settings to the repeater.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    peak:
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
    min_val:
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
    cad_symbol_num:
      default: 2
      selector:
        select:
          options:
            - "1"
            - "2"
            - "4"
            - "8"
            - "16"
    detection_rate:
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: box

db_purge:
  name: Purge database tables
  description: Purge one or more openHop database tables.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    tables:
      required: true
      selector:
        object:

update_radio_config:
  name: Update radio config
  description: Send a raw radio config payload to the Repeater API. Current dev builds accept radio_id for multi-radio targeting and direct_advert_interval_hours for the additional advert schedule.
  fields:
    config_entry_id:
      selector:
        config_entry:
