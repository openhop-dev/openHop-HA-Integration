          min: 1
          max: 10000
          mode: box

get_filtered_packets:
  name: Get filtered packets
  description: Return stored packets filtered by type, route, or time range.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    packet_type:
      selector:
        number:
          min: 0
          max: 255
          mode: box
    route:
      selector:
        number:
          min: 0
          max: 255
          mode: box
    start_timestamp:
      selector:
        number:
          mode: box
    end_timestamp:
      selector:
        number:
          mode: box
    limit:
      default: 1000
      selector:
        number:
          min: 1
          max: 10000
          mode: box

get_packet_by_hash:
  name: Get packet by hash
  description: Return one stored packet by its packet hash.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    packet_hash:
      required: true
      selector:
        text:

get_neighbor_links:
  name: Get neighbor links
  description: Return current observed upstream neighbor-link snapshots.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    active_within_seconds:
      default: 90
      selector:
        number:
          min: 1
          max: 86400
          mode: box
    limit:
      default: 500
      selector:
        number:
          min: 1
          max: 5000
          mode: box

get_neighbor_link_history:
  name: Get neighbor link history
  description: Return raw rows or optional time-bucketed observations for one upstream neighbor hash.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    bucket_seconds:
      description: Optional bucket width in seconds (60–86400). Omit for raw rows; supplying it returns buckets instead.
      selector:
        number:
          min: 60
          max: 86400
          step: 1
          mode: box
          unit_of_measurement: s
    radio_id:
      description: Optional exact nonempty radio ID to filter observations.
      selector:
        text:
    by_radio:
      description: Split time buckets by receiving radio. Requires bucket_seconds when true; omit to retain legacy grouping.
      selector:
        boolean:
    peer_hash:
      required: true
      selector:
        text:
    path_hash_size:
      required: true
      selector:
        number:
          min: 1
          max: 3
          mode: box
    hours:
      default: 24
      selector:
        number:
          min: 1
          max: 168
          mode: box
    limit:
      default: 1000
      selector:
        number:
          min: 1
          max: 5000
          mode: box

get_adverts_by_contact_type:
  name: Get adverts by contact type
  description: Return adverts for one contact type, with paging support.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    contact_type:
      required: true
      selector:
        text:
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 5000
          mode: box
    offset:
      default: 0
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    hours:
      selector:
        number:
          min: 1
          max: 8760
          mode: box

get_adverts_count_by_contact_type:
