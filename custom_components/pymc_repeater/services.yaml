    payload:
      required: true
      selector:
        object:

update_mqtt_config:
  name: Update MQTT config
  description: Send a raw MQTT config payload to the Repeater API, including custom base_topic values and neighbor-publisher settings supported by current dev builds.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    payload:
      required: true
      selector:
        object:

companion_send_text:
  name: Companion send text
