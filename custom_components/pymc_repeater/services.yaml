  description: Return the total advert count for one contact type.
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: pymc_repeater
    contact_type:
      required: true
      selector:
        text:
    hours:
      selector:
        number:
          min: 1
          max: 8760
          mode: box

get_acl_clients:
  name: Get ACL clients
  description: Return authenticated ACL clients, optionally filtered to one identity.
  fields:
    config_entry_id:
