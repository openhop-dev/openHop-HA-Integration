# openHop Repeater dashboard view template
#
# QUICK SETUP
# 1. In Home Assistant, find one entity for your Repeater, such as:
#      sensor.my_repeater_repeater_version
# 2. The part before `_repeater_version` is your entity prefix (`my_repeater`).
# 3. Find and replace every `REPEATER_SLUG` below with that prefix.
# 4. Optionally change the title and path below.
#
# Dynamic MQTT broker, companion, and external-sensor entities vary by install.
# Home Assistant can give dynamic entities area prefixes or numeric suffixes,
# so they cannot always be derived from REPEATER_SLUG. Replace the clearly
# marked example rows with the complete active entity IDs from your instance.
# The modem percentage card below searches active entities and tolerates those
# area prefixes or numeric suffixes. If the sensor is not named `modem`, replace
# `_sensor_modem_` in its two template match strings with the actual sensor slug.
#
# This template uses only built-in Home Assistant cards.
# Replace ALL dynamic example rows below with exact entity IDs from this
# Repeater's device/child devices. Radio children have independent prefixes.
# Remove unsupported rows/cards; never borrow another Repeater's readings.
# Plugin-manager counts are unknown on older builds or if the manager is down.
# Replace these example rows with broker entities from your installation.
# Replace these example rows with companion entities from your installation.
# Ordered full-width bands require a current Home Assistant Sections frontend.
title: Example openHop Repeater
path: example-openhop-repeater
icon: mdi:radio-tower
type: sections
badges:
- entity: binary_sensor.REPEATER_SLUG_mqtt_broker_connected
  name: MQTT
  show_name: true
- type: entity
  entity: binary_sensor.REPEATER_SLUG_component_api_connected
  name: API
  show_name: true
- entity: binary_sensor.REPEATER_SLUG_mqtt_handler_active
  name: MQTT handler
  show_name: true
- entity: binary_sensor.REPEATER_SLUG_update_available
  name: Update
  show_name: true
- entity: sensor.REPEATER_SLUG_repeater_version
  name: Firmware
  show_name: true
- entity: select.REPEATER_SLUG_repeater_mode
  name: Mode
  show_name: true
show_icon_and_title: true
max_columns: 3
dense_section_placement: false
sections:
- type: grid
  column_span: 3
  cards:
  - type: heading
    heading: Live overview
    heading_style: title
    grid_options:
      columns: full
      rows: 1
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.REPEATER_SLUG_component_api_connected
      state: 'off'
    card:
      type: markdown
      content: '**Attention:** Repeater API disconnected. See diagnostics below.'
    grid_options:
      columns: full
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.REPEATER_SLUG_component_stats_problem
      state: 'on'
    card:
      type: markdown
      content: '**Attention:** Packet statistics unavailable. See diagnostics below.'
    grid_options:
      columns: full
      rows: auto
  - type: conditional
    conditions:
    - condition: state
      entity: binary_sensor.REPEATER_SLUG_component_hardware_stats_problem
      state: 'on'
    card:
      type: markdown
      content: '**Attention:** Hardware statistics unavailable. See diagnostics below.'
    grid_options:
      columns: full
      rows: auto
  - type: tile
    entity: sensor.REPEATER_SLUG_packets_received_per_hour
    name: Received / h
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: tile
    entity: sensor.REPEATER_SLUG_packets_forwarded_per_hour
    name: Forwarded / h
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: tile
    entity: sensor.REPEATER_SLUG_packet_drop_rate_24h
    name: Drops · 24 h
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: tile
    entity: sensor.REPEATER_SLUG_current_noise_floor
    name: Noise floor
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: tile
    entity: sensor.REPEATER_SLUG_radio_utilization
    name: Radio use
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: tile
    entity: sensor.REPEATER_SLUG_cpu_usage
    name: CPU use
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: tile
    entity: sensor.REPEATER_SLUG_sensor_modem_die_temperature_c
    name: Modem temperature
    tap_action:
      action: more-info
    grid_options:
      columns: 6
      rows: 1
  - type: vertical-stack
    cards:
    - type: markdown
      title: External Modem Percentages
      card_size: 2
      content: |
        {% set ns = namespace(battery=none, battery_unit='%', solar=none, solar_unit='%/h') %}
        {% for item in states.sensor %}
          {% if 'REPEATER_SLUG_sensor_modem_battery_percent' in item.entity_id and item.state not in ['unknown', 'unavailable'] %}
            {% set ns.battery = item.state %}
            {% set ns.battery_unit = item.attributes.get('unit_of_measurement', '%') %}
          {% endif %}
          {% if 'REPEATER_SLUG_sensor_modem_solar_charge_rate_percent_per_hour' in item.entity_id and item.state not in ['unknown', 'unavailable'] %}
            {% set ns.solar = item.state %}
            {% set ns.solar_unit = item.attributes.get('unit_of_measurement', '%/h') %}
          {% endif %}
        {% endfor %}
        **Battery:** {% if ns.battery is not none %}{{ ns.battery }} {{ ns.battery_unit }}{% else %}Not reported{% endif %}

        **Solar charge rate:** {% if ns.solar is not none %}{{ ns.solar }} {{ ns.solar_unit }}{% else %}Not reported{% endif %}
    grid_options:
      columns: 12
      rows: auto
