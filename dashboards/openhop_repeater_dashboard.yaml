    - type: markdown
      title: External Modem Percentages
      card_size: 2
      content: |
        {% set ns = namespace(battery=none, battery_unit='%', solar=none, solar_unit='%/h') %}
        {% for item in states.sensor %}
          {% if 'REPEATER_SLUG_sensor_modem_battery_percent' in item.entity_id and item.state not in ['unknown', 'unavailable'] %}
            {% set ns.battery = item.state %}
            {% set ns.battery_unit = item.attributes.get('unit_of_measurement', '%') %}
          {% endif %}
          {% if 'REPEATER_SLUG_sensor_modem_solar_charge_rate_percent_per_hour' in item.entity_id and item.state not in ['unknown', 'unavailable'] %}
            {% set ns.solar = item.state %}
            {% set ns.solar_unit = item.attributes.get('unit_of_measurement', '%/h') %}
          {% endif %}
        {% endfor %}
        **Battery:** {% if ns.battery is not none %}{{ ns.battery }} {{ ns.battery_unit }}{% else %}Not reported{% endif %}

        **Solar charge rate:** {% if ns.solar is not none %}{{ ns.solar }} {{ ns.solar_unit }}{% else %}Not reported{% endif %}
