# Single Lovelace view, not a full dashboard. Replace REPEATER_SLUG with
# your device prefix. Replace dynamic rows with exact entity IDs from HA.
# Built-in cards only. Keep the comprehensive dashboard for diagnostics.
title: openHop operations
path: openhop-operations
icon: mdi:radio-tower
cards:
  - type: entities
    title: Availability and updates
    show_header_toggle: false
    entities:
      - binary_sensor.REPEATER_SLUG_component_api_connected
      - sensor.REPEATER_SLUG_component_api_last_success
      - update.REPEATER_SLUG_repeater_software
      - sensor.REPEATER_SLUG_repeater_version
  - type: entities
    title: Component health
    show_header_toggle: false
    entities:
      - binary_sensor.REPEATER_SLUG_component_stats_problem
      - binary_sensor.REPEATER_SLUG_component_mqtt_status_problem
      - binary_sensor.REPEATER_SLUG_component_plugin_summary_problem
      - sensor.REPEATER_SLUG_failed_plugins
  - type: markdown
    title: Site-specific monitoring
    content: >-
      Add your exact radio inventory/settings, selected MQTT broker, battery percentage,
      voltage, charge-state trend, temperature, sensor age/stale, and individual plugin problem
      entities here using the card editor. Dynamic names and registry suffixes
      vary by installation. Missing or stale readings are not healthy zeroes.
  # Optional: install the companion scripts and replace their entry ID first.
  - type: button
    show_icon: false
    name: Check plugin updates · read-only
    icon: mdi:puzzle-check-outline
    tap_action:
      action: perform-action
      perform_action: script.openhop_example_check_plugin_updates
  - type: markdown
    title: Explicit management
    content: >-
      No plugin upgrades or configuration replacements run automatically.
      Use the comprehensive view and its companion script fields for lifecycle,
      sensor configuration, ACL permissions and on-demand diagnostics.
      [Setup and safety](https://github.com/openhop-dev/openHop-HA-Integration/blob/dev/docs/dashboard-management.md).
  - type: history-graph
    title: Resource trends
    hours_to_show: 12
    entities:
      - sensor.REPEATER_SLUG_cpu_usage
      - sensor.REPEATER_SLUG_memory_usage
