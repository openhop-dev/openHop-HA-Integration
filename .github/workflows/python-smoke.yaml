name: Python Smoke

on:
  push:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - ".github/workflows/python-smoke.yaml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests/**"
      - "hacs.json"
      - ".github/workflows/python-smoke.yaml"
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Source-only coverage: HA 2024.1 needs >=3.11.0; HA 2026.11 needs >=3.14.2.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/pymc_repeater/manifest.json > /dev/null
          python -m json.tool custom_components/pymc_repeater/translations/en.json > /dev/null
          python -m json.tool hacs.json > /dev/null

      - name: Compile integration
        run: python -m compileall custom_components/pymc_repeater

      - name: Run contract tests
        run: python -m unittest discover -s tests -v
