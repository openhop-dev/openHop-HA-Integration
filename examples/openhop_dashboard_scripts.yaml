openhop_example_set_acl_permissions:
  alias: "openHop example: set acl permissions (review required)"
  mode: single
  fields:
    identity_name:
      name: Identity name
      required: true
      selector:
        text: {}
    client_pubkey:
      name: Client pubkey
      required: true
      selector:
        text: {}
    permissions:
      name: Permissions
      required: true
      selector:
        number:
          min: 1
          max: 255
          step: 1
          mode: box
    confirmed:
      name: I reviewed the target and consequences
      required: true
      default: false
      selector:
        boolean: {}
  sequence:
    - condition: template
      value_template: "{{ confirmed | default(false) == true }}"
    - service: pymc_repeater.set_acl_permissions
      data:
        config_entry_id: EXAMPLE_CONFIG_ENTRY_ID
        identity_name: "{{ identity_name }}"
        client_pubkey: "{{ client_pubkey }}"
        permissions: "{{ permissions }}"
      response_variable: result
    - service: persistent_notification.create
      data:
        title: "openHop set acl permissions"
        message: "Action returned. Persistence: {{ 'yes' if result.get('persisted') == true else ('no' if result.get('persisted') == false else 'not reported') }}. Verify the target ACL in the Repeater; no client key is shown here."

# Identity-scoped only: the native service also supports every-ACL removal.
openhop_example_remove_acl_client:
  alias: "openHop example: remove acl client (review required)"
