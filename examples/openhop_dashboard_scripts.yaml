      name: Public key
      required: true
      selector:
        text: {}
    identity_name:
      name: Identity name
      required: true
      selector:
        text: {}
    confirmed:
      name: I reviewed the target and consequences
      required: true
      default: false
      selector:
        boolean: {}
  sequence:
    - condition: template
      value_template: "{{ confirmed | default(false) == true and identity_name is defined and identity_name is string and identity_name | trim | length > 0 }}"
    - service: pymc_repeater.remove_acl_client
      data:
        config_entry_id: EXAMPLE_CONFIG_ENTRY_ID
        public_key: "{{ public_key }}"
        identity_name: "{{ identity_name }}"
