# Merge these top-level script IDs into scripts.yaml (not under another script: key).
# Replace EXAMPLE_CONFIG_ENTRY_ID with the actual integration entry ID, not REPEATER_SLUG.
# Rename openhop_example_ IDs and matching dashboard targets for each Repeater.
# No schedule is installed. Responses stay in script traces, never sensor attributes.
openhop_example_get_plugin_catalogue:
  alias: "openHop example: catalogue check (read-only)"
  mode: single
  sequence:
    - service: pymc_repeater.get_plugin_catalogue
      data:
        config_entry_id: EXAMPLE_CONFIG_ENTRY_ID
        force_refresh: false
      response_variable: result
    - service: persistent_notification.create
      data:
        title: openHop catalogue
        message: "Public catalogue entries returned: {{ [result.get('plugins', []) | count, 100] | min }}. Inspect the action response for approved IDs; no installation was requested."
openhop_example_check_plugin_updates:
  alias: "openHop example: plugin update check (read-only)"
  mode: single
  sequence:
    - service: pymc_repeater.check_plugin_updates
      data:
        config_entry_id: EXAMPLE_CONFIG_ENTRY_ID
        force_refresh: false
      response_variable: result
    - service: persistent_notification.create
      data:
        title: openHop plugin update check
        message: >-
          Checked: {{ result.get('counts', {}).get('success', 0) | int }};
          updates available: {{ result.get('results', []) | selectattr('update_available', 'defined') | selectattr('update_available', 'eq', true) | list | count }};
          skipped: {{ result.get('counts', {}).get('skipped', 0) | int }};
          failed: {{ result.get('counts', {}).get('failure', 0) | int }};
          unknown: {{ result.get('counts', {}).get('unknown', 0) | int }}.
          No upgrade requested. Unknown is not up to date.

openhop_example_install_catalogue_plugin:
  alias: "openHop example: install catalogue plugin (review required)"
  mode: single
  fields:
    plugin_id:
      name: Plugin id
      required: true
      selector:
        text: {}
    confirmed:
      name: I reviewed the target and consequences
      required: true
      default: false
      selector:
        boolean: {}
  sequence:
    - condition: template
      value_template: "{{ confirmed | default(false) == true }}"
    - service: pymc_repeater.install_catalogue_plugin
      data:
        config_entry_id: EXAMPLE_CONFIG_ENTRY_ID
        plugin_id: "{{ plugin_id }}"
        force_refresh: false
      response_variable: result
    - service: persistent_notification.create
      data:
        title: "openHop install catalogue plugin"
        message: "Outcome: {{ result.get('outcome', 'not reported') if result.get('outcome') in ['success', 'failure', 'skipped', 'unknown'] else 'not reported' }}. Reconcile actual Repeater state before retrying failures or unknown outcomes."

